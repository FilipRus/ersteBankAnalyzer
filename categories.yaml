# Category keyword mapping for Erste Bank (George) CSV exports
# Keywords are matched case-insensitively against Partner Name first,
# falling back to Booking details only when Partner Name is absent.
# First match wins — place more specific categories above broader ones.

# Not a category: partners whose Payment Reference column names the real
# merchant (e.g. transfers to your own Revolut / Trade Republic account with
# reference "Spotify subscription"). For these, the Payment Reference is matched
# against the categories below first; if nothing matches, the partner name is used.
_check_payment_reference:
  - Revolut
  - Trade Republic
  - Traderepublic

Adjustments:
  # One-off corrections excluded from income/expense totals
  # (e.g. a refund you had to send back)
  - BAMBORA

